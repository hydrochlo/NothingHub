{% extends 'base.html' %}

{% block content %}
<div class="container my-5 py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card bg-white text-dark border shadow-sm rounded-4 p-4 text-center">
                <i class="bi bi-envelope-check-fill display-4 text-success mb-3"></i>
                <h3 class="fw-bold mb-2">Check Your Inbox</h3>
                <p class="text-secondary small mb-4">
                    We’ve sent password reset instructions to your email. Please check your spam folder if it doesn't appear shortly.
                </p>

                <a href="{% url 'login' %}" class="btn btn-outline-dark w-100 fw-semibold py-2">
                    Back to Login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
