<!-- Left Sidebar Container -->
<div class="col-12 col-lg-3">
    
    <!-- Responsive Offcanvas: Drawer on mobile, Sticky Sidebar on desktop -->
    <div class="offcanvas-lg offcanvas-start card border-0 shadow-sm rounded-4 bg-light filter-sidebar-sticky" 
         tabindex="-1" 
         id="filterSidebar" 
         aria-labelledby="filterSidebarLabel">
        
        <!-- Offcanvas Header (Mobile Drawer Only) -->
        <div class="offcanvas-header border-bottom d-lg-none">
            <h5 class="offcanvas-title fw-bold" id="filterSidebarLabel">
                <i class="bi bi-funnel me-1"></i> Filters
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#filterSidebar" aria-label="Close"></button>
        </div>

        <!-- Filter Form Body -->
        <div class="offcanvas-body d-block p-3">
            <div class="d-none d-lg-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
                <h5 class="fw-bold m-0"><i class="bi bi-funnel me-1"></i> Filters</h5>
                <a href="{% url 'product_list' %}" class="btn btn-sm btn-outline-secondary" title="Reset Filters">
                    <i class="bi bi-arrow-counterclockwise"></i> Reset
                </a>
            </div>

            <form method="GET" action="{% url 'product_list' %}">
                
                <!-- Search Input -->
                <div class="mb-3">
                    <label class="form-label fw-semibold fs-7 text-secondary">Search</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span>
                        <input type="text" name="q" class="form-control bg-white border-start-0" 
                               placeholder="Search products..." value="{{ request.GET.q }}">
                    </div>
                </div>

                <!-- Category Filter -->
                <div class="mb-3">
                    <label class="form-label fw-semibold fs-7 text-secondary">Category</label>
                    <select name="category" class="form-select">
                        <option value="">All Categories</option>
                        {% for cat in categories %}
                            <option value="{{ cat.id }}" {% if request.GET.category == cat.id|stringformat:"s" %}selected{% endif %}>
                                {{ cat.category_name }} ({{ cat.total_products }})
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Sorting Control -->
                <div class="mb-3">
                    <label class="form-label fw-semibold fs-7 text-secondary">Sort By</label>
                    <select name="sort" class="form-select">
                        <option value="newest" {% if request.GET.sort == 'newest' or not request.GET.sort %}selected{% endif %}>Newest Arrivals</option>
                        <option value="price_asc" {% if request.GET.sort == 'price_asc' %}selected{% endif %}>Price: Low to High</option>
                        <option value="price_desc" {% if request.GET.sort == 'price_desc' %}selected{% endif %}>Price: High to Low</option>
                        <option value="popularity" {% if request.GET.sort == 'popularity' %}selected{% endif %}>Popularity</option>
                    </select>
                </div>

                <!-- Price Bounds -->
                <div class="mb-3">
                    <label class="form-label fw-semibold fs-7 text-secondary">Price Range ($)</label>
                    <div class="d-flex align-items-center gap-2">
                        <input type="number" step="0.01" name="min_price" class="form-control form-control-sm" 
                               placeholder="Min" value="{{ request.GET.min_price }}">
                        <span>-</span>
                        <input type="number" step="0.01" name="max_price" class="form-control form-control-sm" 
                               placeholder="Max" value="{{ request.GET.max_price }}">
                    </div>
                </div>

                <!-- In-Stock Toggle -->
                <div class="mb-3">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" name="in_stock" value="true" id="inStockCheck" 
                               {% if request.GET.in_stock == 'true' %}checked{% endif %}>
                        <label class="form-check-label fw-semibold fs-7" for="inStockCheck">In Stock Only</label>
                    </div>
                </div>

                <!-- Filter Submit Button -->
                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary fw-medium">
                        Apply Filters
                    </button>
                    <a href="{% url 'product_list' %}" class="btn btn-sm btn-outline-secondary d-lg-none text-center">
                        <i class="bi bi-arrow-counterclockwise"></i> Reset Filters
                    </a>
                </div>

            </form>
        </div>
    </div>
</div>
