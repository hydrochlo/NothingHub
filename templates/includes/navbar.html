        <div class="collapse navbar-collapse" id="mainNavbar">

            <form class="d-flex mx-lg-4 my-3 my-lg-0 flex-grow-1" role="search">

                <button class="btn btn-light" type="submit">
                    <i class="bi bi-search"></i>
                </button>
            </form>

            <!-- Right Side -->
            <ul class="navbar-nav ms-auto align-items-lg-center">

                <li class="nav-item">

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="bi bi-shop me-1"></i>

                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link position-relative" href="#">
                        <i class="bi bi-cart3 fs-5"></i>

                        <span
                            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"

                            0

                    </a>

                <li class="nav-item dropdown">

                        class="nav-link dropdown-toggle"
                        href="#"
                        role="button"
                        data-bs-toggle="dropdown"
                    >
                        <i class="bi bi-person-circle me-1"></i>
                        Account
                    </a> -->

                    <a
                        class="nav-link dropdown-toggle d-flex align-items-center"
                        href="#"
                        role="button"
                        data-bs-toggle="dropdown"
                        aria-expanded="false"
                    >
                        {% if user.is_authenticated %}
                            <img 
                                src="{{ user.profile.get_avatar_url }}" 
                                alt="{{ user.username }}" 
                                class="rounded-circle me-2" 
                                width="30" 
                                height="30" 
                                style="object-fit: cover;"
                            >
                            <span>{{ user.username }}</span>
                        {% else %}
                            <i class="bi bi-person-circle me-1"></i>
                            Account
                        {% endif %}
                    </a>

                    <ul class="dropdown-menu dropdown-menu-end">
                        {% if user.is_authenticated %}
                        <!-- Items visible only when Logged In -->
                            <li>
                                <a class="dropdown-item" href="#">
                                    <i class="bi bi-person me-2"></i> {{ user.username }}
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item" href="#">
                                    <i class="bi bi-box-seam me-2"></i> My Orders
                                </a>
                            </li>

                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li>
                                <form method="POST" action="{% url 'logout' %}">
                                    {% csrf_token %}
                                    <button type="submit" class="dropdown-item text-danger border-0 bg-transparent w-100 text-start">
                                        <i class="bi bi-box-arrow-right me-2"></i> Logout
                                    </button>
                                </form>
                            </li>

                        <!-- Items visible only when Logged Out -->
                            <li>
                                <a class="dropdown-item" href="{% url 'login' %}">
